<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課堂工具箱 | 國中老師的好幫手</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <h1>🎒 課堂工具箱</h1>
    <p class="subtitle">國中老師上課的好幫手</p>
  </div>
</header>

<nav class="tool-nav" id="toolNav"></nav>

<main>
  <!-- 抽籤 -->
  <section class="tool-page active" id="page-picker">
    <div class="tool-card">
      <h2>🎲 抽籤</h2>
      <p>輸入名單（一行一個），按抽籤隨機選出一個人</p>
      <textarea id="pickerList" rows="6">學生一
學生二
學生三
學生四
學生五
學生六
學生七
學生八</textarea>
      <div class="picker-display" id="pickerDisplay">準備好囉</div>
      <div class="flex-center">
        <button class="btn btn-primary" id="pickerGo">🎲 抽籤</button>
        <button class="btn btn-outline btn-sm" id="pickerReset">重置</button>
      </div>
    </div>
  </section>

  <!-- 轉盤 -->
  <section class="tool-page" id="page-wheel">
    <div class="tool-card">
      <h2>🎡 轉盤</h2>
      <p>輸入選項（一行一個），按轉盤隨機選一個</p>
      <textarea id="wheelList" rows="5">第1組
第2組
第3組
第4組
第5組
第6組</textarea>
      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
        <div class="wheel-center" id="wheelSpinBtn">轉！</div>
      </div>
      <div class="wheel-result" id="wheelResult">點中間按鈕開始轉</div>
    </div>
  </section>

  <!-- 音效 -->
  <section class="tool-page" id="page-sounds">
    <div class="tool-card">
      <h2>🔊 音效板</h2>
      <p>點擊按鈕播放音效，控制課堂節奏</p>
      <div class="sound-grid" id="soundGrid"></div>
      <div class="flex-center mt-3">
        <button class="btn btn-danger btn-sm" id="stopAllBtn">🔇 停止所有音效</button>
      </div>
    </div>
  </section>

  <!-- 計時器 -->
  <section class="tool-page" id="page-timer">
    <div class="tool-card">
      <h2>⏱ 計時器</h2>
      <div class="flex-center mb-2">
        <select id="timerPreset">
          <option value="60">1 分鐘</option>
          <option value="120">2 分鐘</option>
          <option value="180" selected>3 分鐘</option>
          <option value="300">5 分鐘</option>
          <option value="600">10 分鐘</option>
          <option value="900">15 分鐘</option>
          <option value="1800">30 分鐘</option>
          <option value="0">自訂</option>
        </select>
        <input type="number" id="timerCustom" min="1" max="3600" value="5" placeholder="分鐘" style="width:100px" disabled>
      </div>
      <div class="timer-display" id="timerDisplay">03:00</div>
      <div class="flex-center">
        <button class="btn btn-primary" id="timerStart">▶ 開始</button>
        <button class="btn btn-outline" id="timerPause">⏸ 暫停</button>
        <button class="btn btn-danger" id="timerReset">⟳ 重置</button>
      </div>
    </div>
  </section>

  <!-- 搶答器 -->
  <section class="tool-page" id="page-buzzer">
    <div class="tool-card">
      <h2>🔴 搶答器</h2>
      <p>誰先按誰搶到！適合課堂搶答遊戲</p>
      <div class="flex-center mb-2">
        <input type="text" id="buzzerName" placeholder="學生姓名" style="max-width:200px">
        <button class="btn btn-primary btn-sm" id="addBuzzerPlayer">加入</button>
      </div>
      <div id="buzzerPlayers" class="mb-2"></div>
      <div class="text-center">
        <button class="buzzer-btn" id="buzzerBtn">搶答！</button>
      </div>
      <div class="buzzer-result" id="buzzerResult">等待搶答...</div>
      <div class="mt-2">
        <h4>記錄</h4>
        <ol id="buzzerLog"></ol>
        <button class="btn btn-outline btn-sm mt-2" id="clearBuzzerLog">清除記錄</button>
      </div>
    </div>
  </section>

  <!-- 分組 -->
  <section class="tool-page" id="page-groups">
    <div class="tool-card">
      <h2>👥 分組</h2>
      <div class="grid-2">
        <div>
          <label>名單（一行一個）</label>
          <textarea id="groupList" rows="6">學生一
學生二
學生三
學生四
學生五
學生六
學生七
學生八</textarea>
        </div>
        <div>
          <label>每組人數</label>
          <input type="number" id="groupSize" value="3" min="2" max="10">
          <label class="mt-2" style="display:block">或指定組數</label>
          <input type="number" id="groupCount" value="3" min="1" max="20">
          <p style="font-size:13px;color:var(--text-light);margin-top:4px">填每組人數或組數，留一個為 0</p>
        </div>
      </div>
      <div class="flex-center mt-2">
        <button class="btn btn-primary" id="groupGo">👥 開始分組</button>
      </div>
      <div class="group-output" id="groupOutput"></div>
    </div>
  </section>

  <!-- 計分板 -->
  <section class="tool-page" id="page-scoreboard">
    <div class="tool-card">
      <h2>🏆 計分板</h2>
      <div class="flex-center mb-2">
        <input type="text" id="teamNameInput" placeholder="隊伍名稱" style="max-width:180px">
        <button class="btn btn-primary btn-sm" id="addTeamBtn">新增隊伍</button>
      </div>
      <div class="scoreboard-teams" id="teamGrid"></div>
      <div class="flex-center mt-3">
        <button class="btn btn-outline btn-sm" id="resetAllScores">重設所有分數</button>
      </div>
    </div>
  </section>

  <!-- 隨機號碼 -->
  <section class="tool-page" id="page-random-num">
    <div class="tool-card">
      <h2>🔢 隨機號碼</h2>
      <div class="flex-center mb-2">
        <div>
          <label>最小值</label>
          <input type="number" id="randMin" value="1" style="width:100px">
        </div>
        <div>
          <label>最大值</label>
          <input type="number" id="randMax" value="50" style="width:100px">
        </div>
      </div>
      <div class="random-num-display" id="randDisplay">—</div>
      <div class="flex-center">
        <button class="btn btn-primary" id="randGo">🔢 抽號碼</button>
        <button class="btn btn-outline btn-sm" id="randHistoryClear">清除記錄</button>
      </div>
      <div class="mt-2">
        <h4>已抽過的號碼</h4>
        <div id="randHistory" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <p>課堂工具箱 &copy; 2026 — 免費使用，不需要網路連線</p>
</footer>

<script src="js/app.js"></script>
<script src="js/picker.js"></script>
<script src="js/wheel.js"></script>
<script src="js/sounds.js"></script>
<script src="js/timer.js"></script>
<script src="js/buzzer.js"></script>
<script src="js/groups.js"></script>
<script src="js/scoreboard.js"></script>
<script src="js/random-num.js"></script>
</body>
</html>
